YAML
name: SALTO Youth Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository uitchecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python scraper uitvoeren
        run: python salto_scraper.py

      - name: Automatisch opslaan en pushen naar GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update: SALTO courses"
          file_pattern: 'salto_courses.json'
