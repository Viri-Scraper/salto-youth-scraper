YAML
name: SALTO Youth Scraper

on:
  schedule:
    # Draait automatisch elke dag om 06:00 UTC (08:00 Nederlandse tijd)
    - cron: '0 6 * * *'
  workflow_dispatch: # Maakt handmatig starten via de GitHub-interface mogelijk

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Schrijfrechten om salto_courses.json te mogen pushen

    steps:
      - name: Repository uitchecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CRUCIAAL: Haalt de volledige geschiedenis op om 'missing local files' te voorkomen

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python scraper uitvoeren
        run: python salto_scraper.py

      - name: Automatisch opslaan en pushen naar GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update: SALTO courses"
          file_pattern: 'salto_courses.json'
