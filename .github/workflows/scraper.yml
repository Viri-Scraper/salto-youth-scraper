name: SALTO Youth Scraper

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Code ophalen uit repository
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Afhankelijkheden installeren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Scraper uitvoeren
        run: |
          python salto_scraper.py

      - name: Resultaten opslaan en pushen naar GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add salto_courses.json
          git commit -m "Automated update: SALTO courses" || exit 0
          git push
