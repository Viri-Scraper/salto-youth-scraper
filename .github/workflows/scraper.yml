name: SALTO Youth Scraper

on:
  schedule:
    # Draait automatisch elke dag om 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Maakt handmatig starten via GitHub interface mogelijk

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Geef de Action rechten om bestanden aan te passen

    steps:
      - name: Repository uitchecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ophalen volledige geschiedenis voor rebase

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Python scraper uitvoeren
        run: salto_scraper.py # Pas aan als je script anders heet (bijv. scraper.py)

      - name: Wijzigingen committen en veilig pushen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add salto_courses.json
          
          # Commit alleen als er écht veranderingen zijn
          if ! git diff --cached --quiet; then
            git commit -m "Automated update: SALTO courses"
            git fetch origin main
            git rebase origin/main
            git push origin main
          else
            echo "Geen wijzigingen om te committen."
          fi
