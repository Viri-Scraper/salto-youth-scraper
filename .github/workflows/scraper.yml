YAML
name: SALTO Youth Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository uitchecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Python scraper uitvoeren
        run: salto_scraper.py  # Pas aan naar scraper.py als je script zo heet

      - name: Wijzigingen committen en geforceerd samenvoegen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Haal de nieuwste stand op van GitHub
          git fetch origin main
          
          # Merge de nieuwste GitHub wijzigingen, maar behoud ALTIJD het nieuw gescrapte bestand bij een conflict
          git merge origin/main -X ours --no-edit || true
          
          git add salto_courses.json
          
          # Commit en push als er wijzigingen zijn
          if ! git diff --cached --quiet; then
            git commit -m "Automated update: SALTO courses"
            git push origin main
          else
            echo "Geen nieuwe wijzigingen om te pushen."
          fi
