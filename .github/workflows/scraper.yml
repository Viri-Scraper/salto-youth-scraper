name: SALTO Youth Scraper

on:
  schedule:
    # Draait automatisch elke dag om 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch: # Maakt het mogelijk om de actie handmatig te starten via GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Noodzakelijk om wijzigingen te mogen pushen

    steps:
      - name: Repository uitchecken
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Python scraper uitvoeren
        run: salto_scraper.py # Pas de bestandsnaam aan als je script anders heet!

      - name: Wijzigingen committen en pushen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add salto_courses.json
          git commit -m "Automated update: SALTO courses" || exit 0
          git pull --rebase origin main
          git push origin main
