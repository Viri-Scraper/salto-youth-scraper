name: SALTO-YOUTH Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: salto-youth-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python scraper.py

      - name: Verify JSON
        run: |
          test -f data/salto_courses.json
          python -m json.tool data/salto_courses.json > /dev/null
          echo "JSON is geldig."

      - name: Show changes
        run: |
          git status
          git diff -- data/salto_courses.json

      - name: Commit changes
        run: |
          git add data/salto_courses.json

          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            exit 0
          fi

          git commit -m "Automated update: SALTO courses"

      - name: Get latest remote
        run: |
          git fetch origin main

      - name: Rebase changes
        run: |
          git rebase origin/main

      - name: Push
        run: |
          git push origin HEAD:main
