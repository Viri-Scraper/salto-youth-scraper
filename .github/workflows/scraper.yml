name: SALTO Youth Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository uitchecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Python scraper uitvoeren
        # OPLOSSING 1: Altijd 'python' voor het bestand zetten
        run: python salto_scraper.py

      - name: Wijzigingen committen en pushen
        # OPLOSSING 2: Juiste Git volgorde met automatische rebase
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add salto_courses.json
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated update: SALTO courses"
            # Haal nieuwste stand op en plaats jouw commit er bovenaan op
            git pull origin main --rebase -X theirs
            git push origin main
          else
            echo "Geen nieuwe wijzigingen om te pushen."
          fi
