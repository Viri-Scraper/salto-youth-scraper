name: SALTO-YOUTH Scraper

on:
  workflow_dispatch:

  schedule:
    # Elke 6 uur
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python scraper.py

      - name: Check generated file
        run: |
          test -f data/salto_courses.json
          echo "Output file gevonden."
          cat data/salto_courses.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/salto_courses.json

          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Update SALTO-YOUTH courses"
            git push
          fi
