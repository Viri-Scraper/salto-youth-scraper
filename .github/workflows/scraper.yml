name: SALTO-YOUTH Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python scraper.py

      - name: Show generated data
        run: |
          echo "========================================"
          echo "DATA DIRECTORY"
          echo "========================================"

          ls -la data || true

          echo "========================================"
          echo "JSON FILE"
          echo "========================================"

          if [ -f data/salto_courses.json ]; then
            echo "JSON bestaat."
            wc -c data/salto_courses.json
            cat data/salto_courses.json
          else
            echo "ERROR: data/salto_courses.json bestaat NIET."
            exit 1
          fi

      - name: Synchronize with remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Copy generated JSON back
        run: |
          # De scraper heeft het bestand vóór de reset gegenereerd.
          # Daarom draaien we de scraper opnieuw na synchronisatie.
          python scraper.py

      - name: Check Git changes
        run: |
          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short

          echo "========================================"
          echo "GIT DIFF"
          echo "========================================"

          git diff -- data/salto_courses.json

      - name: Commit JSON
        run: |
          git add data/salto_courses.json

          if git diff --cached --quiet; then
            echo "Geen wijzigingen in JSON."
            exit 0
          fi

          git commit -m "Automated update: SALTO courses"

      - name: Push JSON
        run: |
          git push origin HEAD:main
