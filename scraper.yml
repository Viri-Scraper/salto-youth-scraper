YAML
name: SALTO Youth Scraper

on:
  schedule:
    # Draait automatisch elke dag om 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Maakt handmatig starten via de GitHub-interface mogelijk

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Noodzakelijk om salto_courses.json te mogen pushen

    steps:
      - name: Repository uitchecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Volledige geschiedenis ophalen

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Python scraper uitvoeren
        run: python salto_scraper.py

      - name: Wijzigingen committen en veilig pushen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 1. Haal de allernieuwste stand van remote op
          git fetch origin main
          
          # 2. Zet de lokale status gelijk met remote main (zonder gescrapte bestanden kwijt te raken)
          git reset --soft origin/main
          
          # 3. Voeg de nieuw gescrapte JSON toe
          git add salto_courses.json
          
          # 4. Commit en push alleen als er inhoudelijke verschillen zijn
          if ! git diff --cached --quiet; then
            git commit -m "Automated update: SALTO courses"
            git push origin HEAD:main
          else
            echo "Geen nieuwe wijzigingen in salto_courses.json om te pushen."
          fi
